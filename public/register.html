<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Create Account - PeerTutor</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="/css/style.css">
</head>
<body class="bg-light">

  <div class="container d-flex align-items-center justify-content-center py-5">
    <div class="w-100" style="max-width: 520px;">
      <!-- Header -->
      <div class="text-center mb-4">
        <div class="navbar-brand-icon mx-auto mb-3" style="width:48px;height:48px;font-size:18px;">PT</div>
        <h3 class="fw-bold">Create your account</h3>
        <p class="text-muted small">Join PeerTutor in under a minute</p>
      </div>

      <!-- Form -->
      <div class="card border-0 shadow-sm p-4">
        <form id="register-form">
          <div class="row g-3">
            <div class="col-6">
              <label class="form-label fw-semibold small">Full name</label>
              <input type="text" id="name" class="form-control" placeholder="Jane Smith" required>
            </div>
            <div class="col-6">
              <label class="form-label fw-semibold small">Email</label>
              <input type="email" id="email" class="form-control" placeholder="you@uni.edu" required>
            </div>
          </div>

          <div class="mt-3">
            <label class="form-label fw-semibold small">Password</label>
            <input type="password" id="password" class="form-control" placeholder="Min 6 characters" required minlength="6">
          </div>

          <div class="mt-3">
            <label class="form-label fw-semibold small">University</label>
            <input type="text" id="university" class="form-control" placeholder="e.g. University of Toronto" required>
          </div>

          <div class="row g-3 mt-1">
            <div class="col-6">
              <label class="form-label fw-semibold small">Department</label>
              <select id="department" class="form-select" required>
                <option value="">Select...</option>
                <option>Computer Science</option>
                <option>Mathematics</option>
                <option>Physics</option>
                <option>Chemistry</option>
                <option>Biology</option>
                <option>Economics</option>
                <option>Engineering</option>
                <option>Psychology</option>
                <option>English</option>
                <option>History</option>
              </select>
            </div>
            <div class="col-6">
              <label class="form-label fw-semibold small">Year of study</label>
              <select id="yearOfStudy" class="form-select">
                <option value="1">Year 1</option>
                <option value="2">Year 2</option>
                <option value="3">Year 3</option>
                <option value="4">Year 4</option>
                <option value="5">Year 5</option>
                <option value="6">Year 6</option>
              </select>
            </div>
          </div>

          <div class="mt-3">
            <label class="form-label fw-semibold small">I want to...</label>
            <div class="d-flex gap-2">
              <button type="button" class="btn btn-outline-primary flex-fill role-btn active" data-role="STUDENT">Find tutors</button>
              <button type="button" class="btn btn-outline-primary flex-fill role-btn" data-role="TUTOR">Teach only</button>
              <button type="button" class="btn btn-outline-primary flex-fill role-btn" data-role="BOTH">Both</button>
            </div>
            <input type="hidden" id="role" value="STUDENT">
          </div>

          <div id="register-error" class="alert alert-danger d-none small mt-3" role="alert"></div>

          <button type="submit" id="register-btn" class="btn btn-primary w-100 mt-3">Create account</button>
        </form>

        <p class="text-center text-muted small mt-3 mb-0">
          Already have an account? <a href="/login" class="text-decoration-none">Sign in</a>
        </p>
      </div>
    </div>
  </div>

  <script>
    // Role toggle
    document.querySelectorAll(".role-btn").forEach((btn) => {
      btn.addEventListener("click", () => {
        document.querySelectorAll(".role-btn").forEach((b) => b.classList.remove("active"));
        btn.classList.add("active");
        document.getElementById("role").value = btn.dataset.role;
      });
    });

    // Register form
    document.getElementById("register-form").addEventListener("submit", async (e) => {
      e.preventDefault();
      const btn = document.getElementById("register-btn");
      const errorDiv = document.getElementById("register-error");
      btn.disabled = true;
      btn.textContent = "Creating account...";
      errorDiv.classList.add("d-none");

      const res = await fetch("/api/register", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
          name: document.getElementById("name").value,
          email: document.getElementById("email").value,
          password: document.getElementById("password").value,
          university: document.getElementById("university").value,
          department: document.getElementById("department").value,
          yearOfStudy: parseInt(document.getElementById("yearOfStudy").value),
          role: document.getElementById("role").value,
        }),
      });

      const data = await res.json();
      if (!res.ok) {
        errorDiv.textContent = data.error || "Registration failed";
        errorDiv.classList.remove("d-none");
        btn.disabled = false;
        btn.textContent = "Create account";
      } else {
        // Auto sign in
        const loginRes = await fetch("/api/login", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            email: document.getElementById("email").value,
            password: document.getElementById("password").value,
          }),
        });
        if (loginRes.ok) {
          window.location.href = "/dashboard";
        } else {
          window.location.href = "/login";
        }
      }
    });
  </script>
</body>
</html>
