<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign In - PeerTutor</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="/css/style.css">
</head>
<body class="bg-light">

  <div class="container d-flex align-items-center justify-content-center min-vh-100">
    <div class="w-100" style="max-width: 420px;">
      <!-- Header -->
      <div class="text-center mb-4">
        <div class="navbar-brand-icon mx-auto mb-3" style="width:48px;height:48px;font-size:18px;">PT</div>
        <h3 class="fw-bold">Welcome back</h3>
        <p class="text-muted small">Sign in to your PeerTutor account</p>
      </div>

      <!-- Form -->
      <div class="card border-0 shadow-sm p-4">
        <form id="login-form">
          <div class="mb-3">
            <label class="form-label fw-semibold small">Email address</label>
            <input type="email" id="email" class="form-control" placeholder="you@university.edu" required>
          </div>
          <div class="mb-3">
            <label class="form-label fw-semibold small">Password</label>
            <input type="password" id="password" class="form-control" placeholder="Enter your password" required>
          </div>
          <div id="login-error" class="alert alert-danger d-none small" role="alert"></div>
          <button type="submit" id="login-btn" class="btn btn-primary w-100">Sign In</button>
        </form>
        <p class="text-center text-muted small mt-3 mb-0">
          No account? <a href="/register" class="text-decoration-none">Create one free</a>
        </p>
      </div>
    </div>
  </div>

  <script src="/js/auth.js"></script>
  <script>
    document.getElementById("login-form").addEventListener("submit", async (e) => {
      e.preventDefault();
      const btn = document.getElementById("login-btn");
      const errorDiv = document.getElementById("login-error");
      btn.disabled = true;
      btn.textContent = "Signing in...";
      errorDiv.classList.add("d-none");

      const res = await fetch("/api/login", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
          email: document.getElementById("email").value,
          password: document.getElementById("password").value,
        }),
      });

      const data = await res.json();
      if (!res.ok) {
        errorDiv.textContent = data.error || "Login failed";
        errorDiv.classList.remove("d-none");
        btn.disabled = false;
        btn.textContent = "Sign In";
      } else {
        window.location.href = "/dashboard";
      }
    });
  </script>
</body>
</html>
