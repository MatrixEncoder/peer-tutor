<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dashboard - PeerTutor</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="/css/style.css">
</head>
<body class="bg-light">

  <!-- Navbar -->
  <nav class="navbar navbar-expand-lg navbar-light bg-white border-bottom">
    <div class="container">
      <a class="navbar-brand d-flex align-items-center gap-2" href="/">
        <div class="navbar-brand-icon">PT</div>
        <span class="fw-bold">PeerTutor</span>
      </a>
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navMenu">
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse" id="navMenu">
        <ul class="navbar-nav ms-auto align-items-center gap-2">
          <li class="nav-item"><a class="nav-link" href="/tutors">Find Tutors</a></li>
          <li class="nav-item"><a class="nav-link active" href="/dashboard">Dashboard</a></li>
          <li class="nav-item"><a class="nav-link" href="/profile">Profile</a></li>
          <li class="nav-item">
            <span class="me-2 text-muted small" id="nav-username"></span>
            <button class="btn btn-outline-secondary btn-sm" id="nav-signout">Sign Out</button>
          </li>
        </ul>
      </div>
    </div>
  </nav>

  <div class="container py-4">
    <!-- Role Toggle (for BOTH users) -->
    <div class="d-flex justify-content-between align-items-center mb-4" id="role-toggle-row" style="display:none !important">
      <h4 class="fw-bold mb-0" id="dashboard-title">Dashboard</h4>
      <div class="btn-group" id="role-toggle">
        <button class="btn btn-sm btn-primary active" data-view="student">Student View</button>
        <button class="btn btn-sm btn-outline-primary" data-view="tutor">Tutor View</button>
      </div>
    </div>

    <!-- Stats Row -->
    <div class="row g-3 mb-4" id="stats-row">
      <div class="col">
        <div class="stat-card bg-white border rounded-3">
          <div class="stat-value text-warning" id="stat-pending">00</div>
          <div class="stat-label">Pending</div>
        </div>
      </div>
      <div class="col">
        <div class="stat-card bg-white border rounded-3">
          <div class="stat-value text-success" id="stat-accepted">00</div>
          <div class="stat-label">Accepted</div>
        </div>
      </div>
      <div class="col">
        <div class="stat-card bg-white border rounded-3">
          <div class="stat-value text-danger" id="stat-declined">00</div>
          <div class="stat-label">Declined</div>
        </div>
      </div>
      <div class="col">
        <div class="stat-card bg-white border rounded-3">
          <div class="stat-value text-primary" id="stat-completed">00</div>
          <div class="stat-label">Completed</div>
        </div>
      </div>
      <div class="col">
        <div class="stat-card bg-white border rounded-3">
          <div class="stat-value text-info" id="stat-total">00</div>
          <div class="stat-label">Total</div>
        </div>
      </div>
    </div>

    <div class="row g-4">
      <!-- Sessions List -->
      <div class="col-lg-8">
        <div class="card border-0 shadow-sm">
          <div class="card-body">
            <h5 class="card-title fw-bold mb-3" id="sessions-title">My Sessions</h5>
            <div id="sessions-list">
              <div class="text-center py-4">
                <div class="spinner-border spinner-border-sm text-primary" role="status"></div>
              </div>
            </div>
          </div>
        </div>
      </div>

      <!-- Sidebar -->
      <div class="col-lg-4">
        <!-- Quick Actions -->
        <div class="card border-0 shadow-sm mb-3">
          <div class="card-body">
            <h6 class="fw-bold mb-3">Quick Actions</h6>
            <a href="/tutors" class="btn btn-primary btn-sm w-100 mb-2">Find Tutors</a>
            <a href="/profile" class="btn btn-outline-secondary btn-sm w-100">Edit Profile</a>
          </div>
        </div>

        <!-- Review Pending -->
        <div class="card border-0 shadow-sm" id="review-pending-card" style="display:none">
          <div class="card-body">
            <h6 class="fw-bold mb-3">Leave a Review</h6>
            <div id="review-pending-list"></div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- Review Modal -->
  <div class="modal fade" id="reviewModal" tabindex="-1">
    <div class="modal-dialog">
      <div class="modal-content">
        <div class="modal-header">
          <h5 class="modal-title fw-bold">Leave a Review</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
        </div>
        <div class="modal-body">
          <p class="text-muted small mb-3">Rate your session experience</p>
          <div class="text-center mb-3" id="star-selector">
            <span class="star fs-1" data-star="1">&#9733;</span>
            <span class="star fs-1" data-star="2">&#9733;</span>
            <span class="star fs-1" data-star="3">&#9733;</span>
            <span class="star fs-1" data-star="4">&#9733;</span>
            <span class="star fs-1" data-star="5">&#9733;</span>
          </div>
          <textarea id="review-comment" class="form-control" rows="3" placeholder="Share what you found helpful... (optional)"></textarea>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
          <button type="button" class="btn btn-primary" id="submit-review-btn">Submit Review</button>
        </div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="/js/auth.js"></script>
  <script src="/js/dashboard.js"></script>
</body>
</html>
