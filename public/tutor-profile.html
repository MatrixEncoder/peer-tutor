<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tutor Profile - PeerTutor</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="/css/style.css">
</head>
<body class="bg-light">

  <!-- Navbar -->
  <nav class="navbar navbar-expand-lg navbar-light bg-white border-bottom">
    <div class="container">
      <a class="navbar-brand d-flex align-items-center gap-2" href="/">
        <div class="navbar-brand-icon">PT</div>
        <span class="fw-bold">PeerTutor</span>
      </a>
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navMenu">
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse" id="navMenu">
        <ul class="navbar-nav ms-auto align-items-center gap-2">
          <li class="nav-item"><a class="nav-link" href="/tutors">Find Tutors</a></li>
          <li class="nav-item" id="nav-dashboard" style="display:none"><a class="nav-link" href="/dashboard">Dashboard</a></li>
          <li class="nav-item" id="nav-auth-buttons">
            <a href="/login" class="btn btn-outline-primary btn-sm me-1">Sign In</a>
            <a href="/register" class="btn btn-primary btn-sm">Get Started</a>
          </li>
          <li class="nav-item" id="nav-user-info" style="display:none">
            <span class="me-2 text-muted small" id="nav-username"></span>
            <button class="btn btn-outline-secondary btn-sm" id="nav-signout">Sign Out</button>
          </li>
        </ul>
      </div>
    </div>
  </nav>

  <div class="container py-4" id="tutor-content">
    <!-- Populated by JS -->
    <div class="text-center py-5">
      <div class="spinner-border text-primary" role="status"></div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="/js/auth.js"></script>
  <script src="/js/tutor-profile.js"></script>
</body>
</html>
